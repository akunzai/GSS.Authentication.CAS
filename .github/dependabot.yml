---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Floating major tags already track latest minor/patch at runtime.
    # Only surface major action upgrades.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: npm
    directory: /samples/AspNetCoreReactSample/ClientApp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      typescript:
        patterns:
          - typescript
      frontend:
        patterns:
          - '*'
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      aspnetcore:
        patterns:
          - Microsoft.AspNetCore.*
      entityframeworkcore:
        patterns:
          - Microsoft.EntityFrameworkCore.*
      extensions:
        patterns:
          - Microsoft.Extensions.*
      owin:
        patterns:
          - Microsoft.Owin.*
      saml2:
        patterns:
          - Sustainsys.Saml2.*
      playwright:
        patterns:
          - Microsoft.Playwright*
      test-sdk:
        patterns:
          - Microsoft.NET.Test.Sdk
          - Microsoft.TestPlatform.ObjectModel
      xunit:
        patterns:
          - xunit.*
      system:
        patterns:
          - System.Security.Cryptography.Xml
          - System.Text.Encodings.Web
          - System.Text.Json
