---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Workflows intentionally use floating major tags. Ignore the expanded
    # version tags Dependabot resolves within those majors, while still
    # surfacing a future major action upgrade.
    ignore:
      - dependency-name: reviewdog/action-hadolint
        versions:
          - 1.x
      - dependency-name: jdx/mise-action
        versions:
          - 4.x
  - package-ecosystem: npm
    directory: /samples/AspNetCoreReactSample/ClientApp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      typescript:
        patterns:
          - typescript
          - typescript-eslint
      frontend:
        patterns:
          - '*'
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      aspnetcore:
        patterns:
          - Microsoft.AspNetCore.*
      entityframeworkcore:
        patterns:
          - Microsoft.EntityFrameworkCore.*
      extensions:
        patterns:
          - Microsoft.Extensions.*
      owin:
        patterns:
          - Microsoft.Owin.*
      saml2:
        patterns:
          - Sustainsys.Saml2.*
      playwright:
        patterns:
          - Microsoft.Playwright*
      test-sdk:
        patterns:
          - Microsoft.NET.Test.Sdk
          - Microsoft.TestPlatform.ObjectModel
      xunit:
        patterns:
          - xunit.*
      system:
        patterns:
          - System.Security.Cryptography.Xml
          - System.Text.Encodings.Web
          - System.Text.Json
