---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Floating major tags already track latest minor/patch at runtime.
    # Only surface major action upgrades.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: bun
    directory: /samples/AspNetCoreReactSample/ClientApp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      frontend:
        patterns:
          - '*'
  - package-ecosystem: bun
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      playwright:
        patterns:
          - '@playwright/*'
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "coverlet.collector"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Sample projects target net10.0; EF Core 11+ requires net11.0.
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
      # Keep netstandard2.0 and net462 dependencies pinned to 8.0.x LTS
      # (see Directory.Packages.props); non-netstandard targets still receive
      # MicrosoftExtensionsVersion updates via other Microsoft.Extensions.* packages.
      - dependency-name: "Microsoft.Extensions.Caching.Abstractions"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.Extensions.Caching.Memory"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.Extensions.Options"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.Extensions.Primitives"
        update-types:
          - version-update:semver-major
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types:
          - version-update:semver-major
      - dependency-name: "System.Text.Encodings.Web"
        update-types:
          - version-update:semver-major
      - dependency-name: "System.Text.Json"
        update-types:
          - version-update:semver-major
    groups:
      aspnetcore:
        patterns:
          - Microsoft.AspNetCore.*
      entityframeworkcore:
        patterns:
          - Microsoft.EntityFrameworkCore.*
      extensions:
        patterns:
          - Microsoft.Extensions.*
      owin:
        patterns:
          - Microsoft.Owin.*
      saml2:
        patterns:
          - Sustainsys.Saml2.*
      test-sdk:
        patterns:
          - Microsoft.NET.Test.Sdk
          - Microsoft.Testing.*
          - Microsoft.TestPlatform.ObjectModel
      xunit:
        patterns:
          - xunit.*
      system:
        patterns:
          - System.Security.Cryptography.Xml
          - System.Text.Encodings.Web
          - System.Text.Json
