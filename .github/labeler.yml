feature:
  - head-branch:
    - '^feature/.+'
    - '^feat/.+'

bug:
  - head-branch:
    - '^bugfix/.+'
    - '^bug/.+'
    - '^fix/.+'
    - '^hotfix/.+'

refactor:
  - head-branch:
    - '^refactor/.+'

chore:
  - head-branch:
    - '^chore/.+'

dependencies:
  - head-branch:
    - '^dependabot/.+'
    - '^keycloak/.+'
    - '^keycloak-protocol-cas/.+'
  - changed-files:
    - any-glob-to-any-file:
      - '.config/dotnet-tools.json'
      - '**/Directory.Packages.props'

# Workflows and ci/* branches only — not every file under .github/
github_actions:
  - head-branch:
    - '^ci/.+'
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**/*'

# Sample apps only — owin/ is the OWIN library, not a sample
samples:
  - all:
    - changed-files:
      - any-glob-to-any-file:
        - 'samples/**/*'
    - head-branch:
      - '^(?!dependabot/).+'

# Dedicated docs tree / docs? branches — not every *.md touch
documentation:
  - head-branch:
    - '^docs?/.+'
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
