name: Build React Sample Client

on:
  pull_request:
    branches:
      - main
    paths:
      - 'samples/AspNetCoreReactSample/**'
      - 'mise.toml'
      - '.github/workflows/build-react-sample-client.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/AspNetCoreReactSample/ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun (from mise.toml)
        uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run lint
          bun run build
