name: Build React Sample Client

on:
  pull_request:
    branches:
      - main
    paths:
      - 'samples/AspNetCoreReactSample/**'
      - 'mise.toml'
      - '.github/workflows/build-react-sample-client.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/AspNetCoreReactSample/ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R oven-sh/bun -p "bun-linux-x64.zip" -D /tmp
          unzip -q /tmp/bun-linux-x64.zip -d /tmp
          sudo mv /tmp/bun-linux-x64/bun /usr/local/bin/bun
          rm -rf /tmp/bun*
          bun --version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('samples/AspNetCoreReactSample/ClientApp/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run lint
          bun run build
